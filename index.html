  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #1D9E75;
      --teal-dark: #0F6E56;
      --teal-light: #E1F5EE;
      --teal-mid: #5DCAA5;
      --bg: #F7F7F5;
      --surface: #FFFFFF;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.14);
      --text: #1A1A18;
      --text-2: #5A5A56;
      --text-3: #9A9A94;
      --green-bg: #EAF3DE;
      --green-text: #3B6D11;
      --amber-bg: #FAEEDA;
      --amber-text: #854F0B;
      --red-bg: #FCEBEB;
      --red-text: #A32D2D;
      --gray-bg: #F1EFE8;
      --gray-text: #5F5E5A;
      --radius: 10px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body, #root { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    input, select, textarea, button {
      font-family: inherit;
      font-size: 16px;
    }
    button { cursor: pointer; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { createClient } = supabase;
    const { useState, useEffect, useRef, useCallback } = React;

    const SUPABASE_URL = 'https://jvtauhlwkradneoyaepi.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2dGF1aGx3a3JhZG5lb3lhZXBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MTQ2NDEsImV4cCI6MjA5MDk5MDY0MX0.UV22kDarqY-mMgdsNuOQiSHfC81IEiICrQadegQjs-Y';
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const DURATIONS = [30, 45, 60, 90];
    const TREATMENTS = [
      'Peeling', 'Botox', 'Relleno', 'Limpieza facial',
      'Mesoterapia', 'Plasma', 'Laser', 'HIFU', 'Polinucleótidos',
      'Bioestimulador', 'Skin Builder', 'Mesoheal PHLO',
      'Consulta', 'Control', 'Otro'
    ];
    const STATUS = {
      confirmed: { label: 'Confirmada', bg: 'var(--green-bg)', color: 'var(--green-text)' },
      pending:   { label: 'Pendiente',  bg: 'var(--amber-bg)', color: 'var(--amber-text)' },
      possible:  { label: 'Posible',    bg: 'var(--gray-bg)',  color: 'var(--gray-text)'  },
      cancelled: { label: 'Cancelada',  bg: 'var(--red-bg)',   color: 'var(--red-text)'   },
    };

    function getWeekDates(offset = 0) {
      const now = new Date();
      const day = now.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      const monday = new Date(now);
      monday.setDate(now.getDate() + diff + offset * 7);
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        return d;
      });
    }

    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function fmtDay(date) {
      return date.toLocaleDateString('es-CL', { weekday: 'short' })
        .replace('.', '').charAt(0).toUpperCase() + 
        date.toLocaleDateString('es-CL', { weekday: 'short' }).replace('.', '').slice(1);
    }

    function fmtDate(date) {
      return date.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
    }

    const s = {
      app: {
        display: 'flex', flexDirection: 'column',
        height: '100dvh', maxWidth: 480,
        margin: '0 auto', background: 'var(--bg)',
        position: 'relative', overflow: 'hidden',
      },
      header: {
        background: 'var(--teal-dark)', color: '#fff',
        padding: '16px 20px 12px',
        paddingTop: 'calc(16px + env(safe-area-inset-top, 0px))',
        flexShrink: 0,
      },
      headerTop: {
        display: 'flex', alignItems: 'center',
        justifyContent: 'space-between', marginBottom: 4,
      },
      headerTitle: { fontSize: 20, fontWeight: 600, letterSpacing: '-0.3px' },
      headerSub: { fontSize: 13, opacity: 0.75 },
      addBtn: {
        width: 36, height: 36, borderRadius: '50%',
        background: 'rgba(255,255,255,0.2)',
        border: '1px solid rgba(255,255,255,0.3)',
        color: '#fff', fontSize: 22, display: 'flex',
        alignItems: 'center', justifyContent: 'center',
      },
      weekNav: {
        display: 'flex', alignItems: 'center',
        gap: 8, marginTop: 10,
      },
      navBtn: {
        background: 'rgba(255,255,255,0.15)',

        width: 28, height: 28, fontSize: 16,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      },
      weekLabel: { fontSize: 13, opacity: 0.85, flex: 1, textAlign: 'center' },
      scroll: {
        flex: 1, overflowY: 'auto',
        padding: '12px 0',
        paddingBottom: 'calc(70px + var(--safe-bottom))',
      },
      daySection: { marginBottom: 8 },
      dayHeader: {
        display: 'flex', alignItems: 'center',
        gap: 10, padding: '6px 20px',
      },
      dayName: { fontSize: 13, fontWeight: 600, color: 'var(--text-2)', textTransform: 'uppercase', letterSpacing: '0.5px', minWidth: 34 },
      dayDate: { fontSize: 13, color: 'var(--text-3)' },
      dayDot: { flex: 1, height: 1, background: 'var(--border)' },
      todayBadge: {
        background: 'var(--teal)', color: '#fff',
        fontSize: 11, padding: '2px 7px', borderRadius: 10, fontWeight: 500,
      },
      apptCard: {
        margin: '3px 16px', padding: '10px 14px',
        background: 'var(--surface)', borderRadius: 10,
        border: '0.5px solid var(--border)',
        display: 'flex', gap: 12, alignItems: 'flex-start',
        cursor: 'pointer', transition: 'background 0.12s',
      },
      timeCol: { minWidth: 46, paddingTop: 1 },
      timeMain: { fontSize: 15, fontWeight: 600, fontVariantNumeric: 'tabular-nums', color: 'var(--text)', letterSpacing: '-0.3px' },
      timeDur: { fontSize: 11, color: 'var(--text-3)', marginTop: 1 },
      durationBar: { width: 3, borderRadius: 2, flexShrink: 0, alignSelf: 'stretch', minHeight: 8 },
      apptInfo: { flex: 1, minWidth: 0 },
      apptName: { fontSize: 15, fontWeight: 500, color: 'var(--text)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' },
      apptTreatment: { fontSize: 13, color: 'var(--text-2)', marginTop: 1 },
      apptNote: { fontSize: 12, color: 'var(--text-3)', marginTop: 3, fontStyle: 'italic' },
      statusBadge: {
        fontSize: 11, padding: '2px 7px', borderRadius: 8,
        fontWeight: 500, flexShrink: 0, alignSelf: 'flex-start', marginTop: 2,
      },
      emptyDay: {
        margin: '3px 16px', padding: '10px 14px',
        color: 'var(--text-3)', fontSize: 13,
        fontStyle: 'italic',
      },
      possiblesSection: {
        margin: '8px 16px 0',
      },
      possiblesHeader: {
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '8px 0', cursor: 'pointer',
      },
      possiblesTitle: { fontSize: 13, fontWeight: 600, color: 'var(--text-2)', textTransform: 'uppercase', letterSpacing: '0.5px' },
      possiblesCount: {
        fontSize: 11, background: 'var(--teal-light)', color: 'var(--teal-dark)',
        padding: '2px 7px', borderRadius: 10, fontWeight: 500,
      },
      possCard: {
        padding: '9px 14px', background: 'var(--surface)',
        borderRadius: 10, border: '0.5px solid var(--border)',
        marginBottom: 4, cursor: 'pointer',
      },
      possName: { fontSize: 14, fontWeight: 500, color: 'var(--text)' },
      possDetail: { fontSize: 12, color: 'var(--text-2)', marginTop: 2 },
      bottomBar: {
        position: 'fixed', bottom: 0, left: '50%',
        transform: 'translateX(-50%)',
        width: '100%', maxWidth: 480,
        background: 'var(--surface)',
        borderTop: '0.5px solid var(--border)',
        padding: '10px 20px',
        paddingBottom: 'calc(10px + var(--safe-bottom))',
        display: 'flex', gap: 10,
      },
      mainAddBtn: {
        flex: 1, background: 'var(--teal)', color: '#fff',
        border: 'none', borderRadius: 10,
        padding: '12px', fontSize: 15, fontWeight: 600,
        letterSpacing: '-0.2px',
      },
      possAddBtn: {
        background: 'var(--surface)', color: 'var(--text-2)',
        border: '0.5px solid var(--border-strong)', borderRadius: 10,
        padding: '12px 16px', fontSize: 14,
      },
      // Modal
      overlay: {
        position: 'fixed', inset: 0,
        background: 'rgba(0,0,0,0.45)',
        display: 'flex', alignItems: 'flex-end',
        justifyContent: 'center', zIndex: 100,
      },
      modal: {
        background: 'var(--surface)', borderRadius: '20px 20px 0 0',
        width: '100%', maxWidth: 480,
        padding: '0 0 calc(20px + var(--safe-bottom))',
        maxHeight: '92dvh', overflowY: 'auto',
      },
      modalHandle: {
        width: 36, height: 4, borderRadius: 2,
        background: 'var(--border-strong)', margin: '12px auto 0',
      },
      modalHeader: {
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '16px 20px 4px',
      },
      modalTitle: { fontSize: 18, fontWeight: 600, letterSpacing: '-0.3px' },
      closeBtn: {
        width: 32, height: 32, borderRadius: '50%',
        background: 'var(--bg)', border: 'none',
        color: 'var(--text-2)', fontSize: 18,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      },
      form: { padding: '12px 20px 0' },
      label: { fontSize: 12, fontWeight: 600, color: 'var(--text-2)', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: 6, display: 'block' },
      input: {
        width: '100%', padding: '11px 13px',
        background: 'var(--bg)', border: '0.5px solid var(--border-strong)',
        borderRadius: 8, fontSize: 16, color: 'var(--text)',
        outline: 'none', marginBottom: 14,
        WebkitAppearance: 'none',
      },
      select: {
        width: '100%', padding: '11px 13px',
        background: 'var(--bg)', border: '0.5px solid var(--border-strong)',
        borderRadius: 8, fontSize: 16, color: 'var(--text)',
        outline: 'none', marginBottom: 14,
        WebkitAppearance: 'none', appearance: 'none',
      },
      row: { display: 'flex', gap: 10 },
      durationGrid: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, marginBottom: 14 },
      durBtn: (active) => ({
        padding: '10px 0', borderRadius: 8, fontSize: 14, fontWeight: 500,
        border: active ? '1.5px solid var(--teal)' : '0.5px solid var(--border-strong)',
        background: active ? 'var(--teal-light)' : 'var(--bg)',
        color: active ? 'var(--teal-dark)' : 'var(--text-2)',
      }),
      statusGrid: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 14 },
      statBtn: (active, st) => ({
        padding: '10px 0', borderRadius: 8, fontSize: 13, fontWeight: 500,
        border: active ? `1.5px solid ${STATUS[st].color}` : '0.5px solid var(--border-strong)',
        background: active ? STATUS[st].bg : 'var(--bg)',
        color: active ? STATUS[st].color : 'var(--text-2)',
      }),
      saveBtn: {
        width: '100%', background: 'var(--teal)', color: '#fff',
        border: 'none', borderRadius: 10,
        padding: '14px', fontSize: 16, fontWeight: 600,
        marginTop: 4, letterSpacing: '-0.2px',
      },
      deleteBtn: {
        width: '100%', background: 'transparent', color: 'var(--red-text)',
        border: '0.5px solid var(--red-text)', borderRadius: 10,
        padding: '12px', fontSize: 14, fontWeight: 500, marginTop: 10,
      },
      loadingWrap: {
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        height: '100dvh', color: 'var(--teal-dark)', fontSize: 15,
      },
      errorMsg: {
        padding: '8px 12px', background: 'var(--red-bg)', color: 'var(--red-text)',
        borderRadius: 8, fontSize: 13, marginBottom: 12,
      },
    };

    // Inline styles as string templates need to be objects
    // Fix: remove var() in border-radius shorthand for inline styles
    function apptCardStyle(isToday) {
      return {
        margin: '3px 16px', padding: '10px 14px',
        background: isToday ? '#F0FBF7' : 'var(--surface)',
        borderRadius: 10, border: '0.5px solid var(--border)',
        display: 'flex', gap: 12, alignItems: 'flex-start',
        cursor: 'pointer',
      };
    }

    function durationBarStyle(status) {
      const colors = { confirmed: 'var(--teal)', pending: '#EF9F27', possible: '#B4B2A9', cancelled: '#E24B4A' };
      return { width: 3, borderRadius: 2, flexShrink: 0, alignSelf: 'stretch', minHeight: 8, background: colors[status] || 'var(--border)' };
    }

    function App() {
      const [appts, setAppts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [weekOffset, setWeekOffset] = useState(0);
      const [modal, setModal] = useState(null); // null | 'new' | 'newPossible' | appt object
      const [showPossibles, setShowPossibles] = useState(true);
      const [dbReady, setDbReady] = useState(false);
      const [tab, setTab] = useState(() => { try { return localStorage.getItem('miagenda_tab') || 'agenda'; } catch (e) { return 'agenda'; } });
      useEffect(() => { try { localStorage.setItem('miagenda_tab', tab); } catch (e) {} }, [tab]);
      const weekDates = getWeekDates(weekOffset);

      useEffect(() => { initDB(); }, []);
      useEffect(() => { if (dbReady) loadAppts(); }, [dbReady, weekOffset]);

      async function initDB() {
        try {
          // Create table if not exists via RPC or just try to query
          await db.from('agenda_appts').select('id').limit(1);
          setDbReady(true);
        } catch(e) {
          // Table might not exist, try to create via storage workaround
          setDbReady(true); // optimistic
        }
        setLoading(false);
      }

      async function loadAppts() {
        setLoading(true);
        const start = dateKey(weekDates[0]);
        const end = dateKey(weekDates[6]);
        const { data, error } = await db
          .from('agenda_appts')
          .select('*')
          .gte('appt_date', start)
          .lte('appt_date', end)
          .order('appt_date').order('appt_time');

        // Also load possibles (no date)
        const { data: poss } = await db
          .from('agenda_appts')
          .select('*')
          .eq('status', 'possible')
          .is('appt_date', null);

        setAppts([...(data || []), ...(poss || [])]);
        setLoading(false);
      }

      const apptsByDate = {};
      weekDates.forEach(d => { apptsByDate[dateKey(d)] = []; });
      const possibles = [];
      appts.forEach(a => {
        if (!a.appt_date) { possibles.push(a); return; }
        if (apptsByDate[a.appt_date]) apptsByDate[a.appt_date].push(a);
      });

      const today = dateKey(new Date());

      return (
        <div style={s.app}>
          <header style={s.header}>
            <div style={s.headerTop}>
              <div>
                <div style={s.headerTitle}>Mi Agenda</div>
                <div style={s.headerSub}>Clínica Dra. Gormaz</div>
              </div>
              <button style={s.addBtn} onClick={() => setModal('new')}>+</button>
            </div>
            <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
              {[['agenda', 'Agenda'], ['continuidad', 'Continuidad']].map(([k, l]) => (
                <button key={k} onClick={() => setTab(k)} style={{
                  flex: 1, padding: '7px 0', borderRadius: 8, fontSize: 14, fontWeight: 600,
                  border: 'none', background: tab === k ? '#fff' : 'rgba(255,255,255,0.15)',
                  color: tab === k ? 'var(--teal-dark)' : '#fff',
                }}>{l}</button>
              ))}
            </div>
            {tab === 'agenda' && <div style={s.weekNav}>
              <button style={s.navBtn} onClick={() => setWeekOffset(o => o - 1)}>‹</button>
              <span style={s.weekLabel}>
                {fmtDate(weekDates[0])} — {fmtDate(weekDates[6])}
              </span>
              <button style={s.navBtn} onClick={() => setWeekOffset(o => o + 1)}>›</button>
              {weekOffset !== 0 && (
                <button style={{ ...s.navBtn, fontSize: 11, width: 'auto', padding: '0 8px' }}
                  onClick={() => setWeekOffset(0)}>Hoy</button>
              )}
            </div>}
          </header>

          {tab === 'continuidad' && <Continuidad />}

          {tab === 'agenda' && <>
          <div style={s.scroll}>
            {weekDates.map(date => {
              const key = dateKey(date);
              const dayAppts = apptsByDate[key] || [];
              const isToday = key === today;
              return (
                <div key={key} style={s.daySection}>
                  <div style={s.dayHeader}>
                    <span style={{ ...s.dayName, color: isToday ? 'var(--teal-dark)' : undefined }}>
                      {fmtDay(date)}
                    </span>
                    <span style={{ ...s.dayDate, color: isToday ? 'var(--teal)' : undefined, fontWeight: isToday ? 600 : 400 }}>
                      {date.getDate()}
                    </span>
                    {isToday && <span style={s.todayBadge}>Hoy</span>}
                    <div style={s.dayDot} />
                    <span style={{ fontSize: 12, color: 'var(--text-3)' }}>
                      {dayAppts.filter(a => a.status !== 'cancelled').length || ''}
                    </span>
                  </div>
                  {dayAppts.length === 0 ? (
                    <div style={s.emptyDay}>Sin citas</div>
                  ) : (
                    dayAppts.map(appt => (
                      <div key={appt.id} style={apptCardStyle(isToday)} onClick={() => setModal(appt)}>
                        <div style={s.timeCol}>
                          <div style={s.timeMain}>{appt.appt_time?.slice(0,5)}</div>
                          <div style={s.timeDur}>{appt.duration}min</div>
                        </div>
                        <div style={durationBarStyle(appt.status)} />
                        <div style={s.apptInfo}>
                          <div style={s.apptName}>{appt.first_name} {appt.last_name}</div>
                          {appt.treatment && <div style={s.apptTreatment}>{appt.treatment}</div>}
                          {appt.notes && <div style={s.apptNote}>{appt.notes}</div>}
                        </div>
                        <span style={{
                          ...s.statusBadge,
                          background: STATUS[appt.status]?.bg,
                          color: STATUS[appt.status]?.color,
                        }}>
                          {STATUS[appt.status]?.label}
                        </span>
                      </div>
                    ))
                  )}
                </div>
              );
            })}

            {/* Posibles section */}
            <div style={s.possiblesSection}>
              <div style={s.possiblesHeader} onClick={() => setShowPossibles(v => !v)}>
                <span style={s.possiblesTitle}>Posibles / Pendientes</span>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  {possibles.length > 0 && <span style={s.possiblesCount}>{possibles.length}</span>}
                  <span style={{ color: 'var(--text-3)', fontSize: 14 }}>{showPossibles ? '▾' : '▸'}</span>
                </div>
              </div>
              {showPossibles && (
                <div>
                  {possibles.length === 0 && <div style={{ ...s.emptyDay, padding: '6px 0' }}>Sin posibles</div>}
                  {possibles.map(appt => (
                    <div key={appt.id} style={s.possCard} onClick={() => setModal(appt)}>
                      <div style={s.possName}>{appt.first_name} {appt.last_name}</div>
                      <div style={s.possDetail}>
                        {appt.treatment}{appt.treatment && appt.notes ? ' · ' : ''}{appt.notes}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div style={s.bottomBar}>
            <button style={s.mainAddBtn} onClick={() => setModal('new')}>+ Nueva cita</button>
            <button style={s.possAddBtn} onClick={() => setModal('newPossible')}>+ Posible</button>
          </div>
          </>}

          {modal && (
            <ApptModal
              appt={typeof modal === 'object' ? modal : null}
              isPossible={modal === 'newPossible'}
              defaultDate={modal === 'new' ? today : undefined}
              onClose={() => setModal(null)}
              onSave={() => { setModal(null); loadAppts(); }}
            />
          )}
        </div>
      );
    }

    function ApptModal({ appt, isPossible, defaultDate, onClose, onSave }) {
      const isEdit = !!appt;
      const [form, setForm] = useState({
        first_name: appt?.first_name || '',
        last_name: appt?.last_name || '',
        patient_email: appt?.patient_email || '',
        patient_phone: appt?.patient_phone || '',
        appt_date: appt?.appt_date || (isPossible ? '' : defaultDate || ''),
        appt_time: appt?.appt_time?.slice(0,5) || '',
        duration: appt?.duration || 60,
        treatment: appt?.treatment || '',
        status: appt?.status || (isPossible ? 'possible' : 'confirmed'),
        notes: appt?.notes || '',
      });
      const [saving, setSaving] = useState(false);
      const [waModal, setWaModal] = useState(null);
      const [error, setError] = useState('');
      const [pacienteId, setPacienteId] = useState(appt?.paciente_id || null);
      const [suggestions, setSuggestions] = useState([]);
      const [showSug, setShowSug] = useState(false);
      const tratInicial = appt?.treatment || '';
      const inicialEsOtro = !!tratInicial && !TREATMENTS.includes(tratInicial);
      const [esOtro, setEsOtro] = useState(inicialEsOtro || tratInicial === 'Otro');
      const [otroTexto, setOtroTexto] = useState(inicialEsOtro ? tratInicial : '');

      function set(k, v) { setForm(f => ({ ...f, [k]: v })); }

      async function searchPacientes(q) {
        if (!q || q.length < 2) { setSuggestions([]); setShowSug(false); return; }
        const { data } = await db.from('pacientes')
          .select('id, first_name, last_name, email, phone')
          .or(`first_name.ilike.%${q}%,last_name.ilike.%${q}%`)
          .limit(6);
        setSuggestions(data || []);
        setShowSug((data || []).length > 0);
      }

      function selectPaciente(p) {
        setForm(f => ({
          ...f,
          first_name: p.first_name,
          last_name: p.last_name || f.last_name,
          patient_email: p.email || f.patient_email,
          patient_phone: p.phone || f.patient_phone,
        }));
        setPacienteId(p.id);
        setSuggestions([]);
        setShowSug(false);
      }

      async function save() {
        if (!form.first_name.trim()) { setError('Ingresa el nombre'); return; }
        if (!isPossible && form.status !== 'possible' && (!form.appt_date || !form.appt_time)) {
          setError('Ingresa fecha y hora'); return;
        }
        setSaving(true); setError('');

        // Upsert paciente si no viene de autocomplete
        let pid = pacienteId;
        if (!pid && form.first_name.trim()) {
          const pData = {
            first_name: form.first_name.trim(),
            last_name: form.last_name.trim() || null,
            email: form.patient_email.trim() || null,
            phone: form.patient_phone.trim() || null,
          };
          const { data: pRow } = await db.from('pacientes').insert([pData]).select('id').single();
          if (pRow) pid = pRow.id;
        }

        const payload = {
          first_name: form.first_name.trim(),
          last_name: form.last_name.trim(),
          patient_email: form.patient_email.trim() || null,
          patient_phone: form.patient_phone.trim() || null,
          appt_date: form.appt_date || null,
          appt_time: form.appt_time || null,
          duration: form.duration,
          treatment: form.treatment,
          status: form.status,
          notes: form.notes.trim(),
          paciente_id: pid || null,
        };
        let err;
        if (isEdit) {
          ({ error: err } = await db.from('agenda_appts').update(payload).eq('id', appt.id));
        } else {
          ({ error: err } = await db.from('agenda_appts').insert([payload]));
        }
        if (err) { setError('Error al guardar: ' + err.message); setSaving(false); return; }

        // Email de confirmación (fire & forget)
        if (payload.patient_email && payload.appt_date && payload.status !== 'cancelled' && payload.status !== 'possible') {
          fetch(`${SUPABASE_URL}/functions/v1/send-email`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
            body: JSON.stringify({
              to: payload.patient_email,
              first_name: payload.first_name,
              treatment: payload.treatment,
              appt_date: payload.appt_date,
              appt_time: payload.appt_time,
            }),
          }).catch(console.warn);
        }

        // Modal de WhatsApp para citas nuevas con fecha y hora
        if (!isEdit && payload.appt_date && payload.appt_time) {
          setSaving(false);
          setWaModal({
            name: payload.first_name,
            treatment: payload.treatment || '',
            date: payload.appt_date,
            time: payload.appt_time,
            phone: payload.patient_phone || '',
          });
        } else {
          onSave();
        }
      }

      async function del() {
        if (!confirm('¿Eliminar esta cita?')) return;
        await db.from('agenda_appts').delete().eq('id', appt.id);
        onSave();
      }

      function fmtApptDate(iso) {
        const [y, m, d] = iso.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
        const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
        return `${dias[dt.getDay()]} ${d} de ${meses[m-1]} de ${y}`;
      }

      function buildWaLink(phone, name, treatment, date, time) {
        const digits = phone.replace(/\D/g, '');
        const msg = `Hola ${name}, tu cita para ${treatment} ha quedado agendada para el día ${fmtApptDate(date)} a las ${time.slice(0,5)} horas.\n\nRecuerda que, en caso de no asistir, necesito que avises con al menos 24 hrs de anticipación para evitar tener que cobrar el tiempo perdido.\n\nMe alegra verte, recuerda que la dirección es Av. Kennedy 5600, piso 10, of 1016, Vitacura.\n\nCualquier duda al +56978643128.\n\nSaludos, Dra. Ana María Gormáz R.`;
        return `https://wa.me/${digits}?text=${encodeURIComponent(msg)}`;
      }

      const noPossible = form.status !== 'possible';

      return (
        <>
        {waModal && (
          <div style={{ ...s.overlay, zIndex: 200 }}>
            <div style={{ ...s.modal, padding: '0 0 calc(24px + var(--safe-bottom))' }}>
              <div style={s.modalHandle} />
              <div style={{ padding: '20px 20px 0', textAlign: 'center' }}>
                <div style={{ fontSize: 40, marginBottom: 10 }}>✓</div>
                <div style={{ fontSize: 19, fontWeight: 600, letterSpacing: '-0.3px', marginBottom: 6 }}>¡Cita guardada!</div>
                <div style={{ fontSize: 14, color: 'var(--text-2)', lineHeight: 1.6 }}>
                  <span style={{ fontWeight: 500, color: 'var(--text)' }}>{waModal.name}</span>
                  {waModal.treatment ? ` · ${waModal.treatment}` : ''}<br/>
                  {fmtApptDate(waModal.date)} · {waModal.time.slice(0,5)}h
                </div>
              </div>
              <div style={{ padding: '20px 20px 0' }}>
                {waModal.phone && (
                  <a
                    href={buildWaLink(waModal.phone, waModal.name, waModal.treatment, waModal.date, waModal.time)}
                    target="_blank" rel="noopener noreferrer"
                    style={{ display: 'block', background: '#25D366', color: '#fff', borderRadius: 10, padding: '14px', fontSize: 16, fontWeight: 600, textAlign: 'center', textDecoration: 'none', marginBottom: 10, letterSpacing: '-0.2px' }}
                    onClick={onSave}>
                    Enviar por WhatsApp
                  </a>
                )}
                <button
                  style={{ width: '100%', background: 'var(--bg)', color: 'var(--text-2)', border: '0.5px solid var(--border-strong)', borderRadius: 10, padding: '13px', fontSize: 15, fontWeight: 500 }}
                  onClick={onSave}>
                  Listo
                </button>
              </div>
            </div>
          </div>
        )}
        <div style={s.overlay} onClick={e => e.target === e.currentTarget && onClose()}>
          <div style={s.modal}>
            <div style={s.modalHandle} />
            <div style={s.modalHeader}>
              <div style={s.modalTitle}>{isEdit ? 'Editar cita' : isPossible ? 'Nueva posible' : 'Nueva cita'}</div>
              <button style={s.closeBtn} onClick={onClose}>×</button>
            </div>
            <div style={s.form}>
              {error && <div style={s.errorMsg}>{error}</div>}

              <div style={s.row}>
                <div style={{ flex: 1, position: 'relative' }}>
                  <label style={s.label}>Nombre</label>
                  <input style={s.input} value={form.first_name}
                    onChange={e => { set('first_name', e.target.value); setPacienteId(null); searchPacientes(e.target.value); }}
                    onBlur={() => setTimeout(() => setShowSug(false), 160)}
                    placeholder="Ana" autoFocus={!isEdit} />
                  {showSug && suggestions.length > 0 && (
                    <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 200, background: 'var(--surface)', borderRadius: 8, boxShadow: '0 4px 16px rgba(0,0,0,0.12)', border: '0.5px solid var(--border-strong)', overflow: 'hidden', marginTop: 2 }}>
                      {suggestions.map(p => (
                        <div key={p.id} onMouseDown={() => selectPaciente(p)}
                          style={{ padding: '10px 13px', cursor: 'pointer', borderBottom: '0.5px solid var(--border)', fontSize: 14 }}>
                          <span style={{ fontWeight: 500 }}>{p.first_name} {p.last_name}</span>
                          {p.email && <span style={{ color: 'var(--text-3)', fontSize: 12, marginLeft: 8 }}>{p.email}</span>}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div style={{ flex: 1 }}>
                  <label style={s.label}>Apellido</label>
                  <input style={s.input} value={form.last_name} onChange={e => set('last_name', e.target.value)} placeholder="Gómez" />
                </div>
              </div>
              <div style={s.row}>
                <div style={{ flex: 1 }}>
                  <label style={s.label}>Email <span style={{ color: 'var(--text-3)', fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>(confirmación)</span></label>
                  <input style={s.input} type="email" value={form.patient_email} onChange={e => set('patient_email', e.target.value)} placeholder="ana@email.com" />
                </div>
                <div style={{ flex: 1 }}>
                  <label style={s.label}>Teléfono</label>
                  <input style={s.input} type="tel" value={form.patient_phone} onChange={e => set('patient_phone', e.target.value)} placeholder="+56 9 …" />
                </div>
              </div>

              <label style={s.label}>Estado</label>
              <div style={s.statusGrid}>
                {Object.entries(STATUS).map(([k, v]) => (
                  <button key={k} style={s.statBtn(form.status === k, k)} onClick={() => set('status', k)}>{v.label}</button>
                ))}
              </div>

              {(noPossible || form.appt_date) && <>
                <div style={s.row}>
                  <div style={{ flex: 1 }}>
                    <label style={s.label}>Fecha</label>
                    <input type="date" style={s.input} value={form.appt_date} onChange={e => set('appt_date', e.target.value)} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <label style={s.label}>Hora</label>
                    <input type="time" style={s.input} value={form.appt_time} onChange={e => set('appt_time', e.target.value)} step="900" />
                  </div>
                </div>
              </>}

              <label style={s.label}>Duración</label>
              <div style={s.durationGrid}>
                {DURATIONS.map(d => (
                  <button key={d} style={s.durBtn(form.duration === d)} onClick={() => set('duration', d)}>{d}min</button>
                ))}
              </div>

              <label style={s.label}>Tratamiento</label>
              <select style={s.select} value={esOtro ? 'Otro' : form.treatment}
                onChange={e => { const v = e.target.value; if (v === 'Otro') { setEsOtro(true); set('treatment', otroTexto || 'Otro'); } else { setEsOtro(false); set('treatment', v); } }}>
                <option value="">Seleccionar…</option>
                {TREATMENTS.map(t => <option key={t}>{t}</option>)}
              </select>
              {esOtro && (
                <input style={s.input} value={otroTexto} placeholder="¿Cuál tratamiento?"
                  onChange={e => { setOtroTexto(e.target.value); set('treatment', e.target.value.trim() || 'Otro'); }} />
              )}

              <label style={s.label}>Nota <span style={{ color: 'var(--text-3)', fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>(referida por, teléfono, etc.)</span></label>
              <input style={s.input} value={form.notes} onChange={e => set('notes', e.target.value)} placeholder="Referida por Kathy · +56 9 ..." />

              <button style={{ ...s.saveBtn, opacity: saving ? 0.7 : 1 }} onClick={save} disabled={saving}>
                {saving ? 'Guardando…' : isEdit ? 'Guardar cambios' : 'Agregar cita'}
              </button>
              {isEdit && <button style={s.deleteBtn} onClick={del}>Eliminar cita</button>}
              <div style={{ height: 8 }} />
            </div>
          </div>
        </div>
        </>
      );
    }

    // ── Continuidad ──────────────────────────────────────────────
    const MOTIVOS = [
      ['control', 'Control'], ['mantencion', 'Mantención'], ['complementario', 'Complementario'],
      ['responder', 'Responder'], ['evento', 'Evento'], ['otro', 'Otro'],
    ];
    const MOTIVO_LABEL = Object.fromEntries(MOTIVOS);

    function sumarDias(iso, n) {
      const [y, m, d] = iso.split('-').map(Number);
      return dateKey(new Date(y, m - 1, d + n));
    }
    function sumarMeses(iso, n) {
      const [y, m, d] = iso.split('-').map(Number);
      return dateKey(new Date(y, m - 1 + n, d));
    }
    function fmtCorto(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
    }
    function telWa(raw) {
      let t = (raw || '').replace(/\D/g, '');
      if (!t) return '';
      if (t.length === 8) t = '569' + t;
      else if (t.length === 9 && t.startsWith('9')) t = '56' + t;
      return t;
    }
    function nombreCompleto(p) {
      return [p?.first_name, p?.last_name].filter(Boolean).join(' ');
    }

    function Continuidad() {
      const [segs, setSegs] = useState([]);
      const [telefonos, setTelefonos] = useState({});
      const [cargando, setCargando] = useState(true);
      const [error, setError] = useState('');
      const [verProgramados, setVerProgramados] = useState(false);
      const hoy = dateKey(new Date());

      useEffect(() => { cargar(); }, []);

      async function cargar() {
        setCargando(true); setError('');
        const { data, error: e } = await db.from('continuidad_seguimientos')
          .select('*, pacientes(first_name, last_name, phone)')
          .not('estado', 'in', '(cerrado,agendo)')
          .order('proximo_contacto', { ascending: true, nullsFirst: true })
          .order('fecha_atencion', { ascending: true });
        if (e) { setError('No pude cargar los seguimientos: ' + e.message); setCargando(false); return; }
        const lista = data || [];
        // Teléfono: de la ficha; si no hay, del último registro de cita
        const sinTel = lista.filter(x => !x.pacientes?.phone).map(x => x.paciente_id);
        const tels = {};
        if (sinTel.length) {
          const { data: citas } = await db.from('agenda_appts')
            .select('paciente_id, patient_phone, appt_date')
            .in('paciente_id', sinTel).not('patient_phone', 'is', null)
            .order('appt_date', { ascending: false });
          (citas || []).forEach(c => { if (c.patient_phone && !tels[c.paciente_id]) tels[c.paciente_id] = c.patient_phone; });
        }
        setTelefonos(tels);
        setSegs(lista);
        setCargando(false);
      }

      async function actualizar(id, cambios) {
        const { error: e } = await db.from('continuidad_seguimientos').update(cambios).eq('id', id);
        if (e) { setError('No se pudo guardar: ' + e.message); return false; }
        await cargar();
        return true;
      }

      const enHoy = x => x.estado === 'mensaje_listo' || x.estado === 'sin_respuesta' || x.estado === 'respondio'
        || ((x.estado === 'programado' || x.estado === 'en_pausa') && x.proximo_contacto && x.proximo_contacto <= hoy);
      const listaHoy = segs.filter(enHoy);
      const fugas = segs.filter(x => x.estado === 'por_programar');
      const enviados = segs.filter(x => x.estado === 'enviado');
      const programados = segs.filter(x => (x.estado === 'programado' || x.estado === 'en_pausa') && !enHoy(x));

      const titulo = { fontSize: 13, fontWeight: 600, color: 'var(--text-2)', textTransform: 'uppercase', letterSpacing: '0.5px', padding: '14px 20px 6px', display: 'flex', alignItems: 'center', gap: 8 };
      const card = { margin: '4px 16px', padding: '12px 14px', background: 'var(--surface)', borderRadius: 10, border: '0.5px solid var(--border)' };
      const vacio = { ...s.emptyDay, margin: '0 16px' };

      if (cargando && !segs.length) return <div style={{ ...s.scroll, padding: 20, color: 'var(--text-3)' }}>Cargando…</div>;

      return (
        <div style={{ ...s.scroll, paddingBottom: 'calc(30px + var(--safe-bottom))' }}>
          <div style={{ display: 'flex', gap: 8, margin: '0 16px 4px' }}>
            {[['Contactos hoy', listaHoy.length, 'var(--teal-light)', 'var(--teal-dark)'],
              ['Fugas', fugas.length, fugas.length ? 'var(--red-bg)' : 'var(--gray-bg)', fugas.length ? 'var(--red-text)' : 'var(--gray-text)'],
              ['Esperando', enviados.length, 'var(--gray-bg)', 'var(--gray-text)']].map(([l, n, bg, c]) => (
              <div key={l} style={{ flex: 1, background: bg, color: c, borderRadius: 10, padding: '10px 8px', textAlign: 'center' }}>
                <div style={{ fontSize: 22, fontWeight: 700, fontVariantNumeric: 'tabular-nums' }}>{n}</div>
                <div style={{ fontSize: 12, fontWeight: 500 }}>{l}</div>
              </div>
            ))}
          </div>
          {error && <div style={{ ...s.errorMsg, margin: '8px 16px' }}>{error}</div>}

          <div style={titulo}>Hoy</div>
          {listaHoy.length === 0 && <div style={vacio}>Nadie a quien escribir hoy</div>}
          {listaHoy.map(x => (
            <TarjetaHoy key={x.id} seg={x} hoy={hoy} card={card}
              telefono={x.pacientes?.phone || telefonos[x.paciente_id] || ''}
              actualizar={actualizar} />
          ))}

          <div style={titulo}>Fugas <span style={{ fontWeight: 400, textTransform: 'none', letterSpacing: 0, color: 'var(--text-3)' }}>· atendidas sin próximo contacto</span></div>
          {fugas.length === 0 && <div style={vacio}>Sin fugas</div>}
          {fugas.map(x => <TarjetaFuga key={x.id} seg={x} hoy={hoy} card={card} actualizar={actualizar} />)}

          <div style={titulo}>Esperando respuesta</div>
          {enviados.length === 0 && <div style={vacio}>Nada pendiente</div>}
          {enviados.map(x => (
            <div key={x.id} style={card}>
              <div style={{ fontSize: 15, fontWeight: 500 }}>{nombreCompleto(x.pacientes)}</div>
              <div style={{ fontSize: 13, color: 'var(--text-2)', marginTop: 2 }}>
                Enviado {fmtCorto(x.fecha_envio)}{x.intento > 1 ? ' · 2º contacto' : ''}
              </div>
              <BotonesResultado seg={x} hoy={hoy} actualizar={actualizar} />
            </div>
          ))}

          <div style={{ ...titulo, cursor: 'pointer' }} onClick={() => setVerProgramados(v => !v)}>
            Programados <span style={s.possiblesCount}>{programados.length}</span>
            <span style={{ marginLeft: 'auto', color: 'var(--text-3)' }}>{verProgramados ? '▾' : '▸'}</span>
          </div>
          {verProgramados && programados.map(x => (
            <FilaProgramado key={x.id} seg={x} hoy={hoy} card={card} actualizar={actualizar} />
          ))}
          <div style={{ textAlign: 'center', marginTop: 16 }}>
            <button onClick={cargar} style={{ ...s.possAddBtn, padding: '8px 14px', fontSize: 13 }}>Actualizar</button>
          </div>
        </div>
      );
    }

    function TarjetaHoy({ seg, hoy, card, telefono, actualizar }) {
      const [texto, setTexto] = useState(seg.mensaje_propuesto || '');
      const [preguntar, setPreguntar] = useState(false);
      const [verAlt, setVerAlt] = useState(false);
      const tel = telWa(telefono);
      const atrasado = seg.proximo_contacto && seg.proximo_contacto < hoy;
      const etiqueta = seg.estado === 'sin_respuesta' ? '2º contacto'
        : seg.estado === 'respondio' ? 'Respondió: falta concretar'
        : MOTIVO_LABEL[seg.motivo] || 'Contacto';
      const link = tel ? `https://wa.me/${tel}?text=${encodeURIComponent(texto)}` : '';

      async function marcarEnviado() {
        await actualizar(seg.id, {
          estado: 'enviado', fecha_envio: hoy, mensaje_propuesto: texto,
          intento: seg.estado === 'sin_respuesta' ? 2 : (seg.intento || 1),
        });
        setPreguntar(false);
      }

      return (
        <div style={card}>
          <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}>
            <div style={{ fontSize: 15, fontWeight: 500 }}>{nombreCompleto(seg.pacientes)}</div>
            {atrasado && <span style={{ ...s.statusBadge, background: 'var(--amber-bg)', color: 'var(--amber-text)', marginTop: 0 }}>Atrasado · {fmtCorto(seg.proximo_contacto)}</span>}
          </div>
          <div style={{ fontSize: 13, color: 'var(--text-2)', marginTop: 2 }}>
            {etiqueta}{seg.tratamiento ? ` · ${seg.tratamiento} (${fmtCorto(seg.fecha_atencion)})` : ''}
          </div>
          {seg.conversado && <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4, fontStyle: 'italic' }}>{seg.conversado}</div>}
          <textarea value={texto} onChange={e => setTexto(e.target.value)} rows={4}
            placeholder="El asistente redacta el mensaje en la lista de la mañana. También puedes escribirlo aquí."
            style={{ ...s.input, marginTop: 10, marginBottom: 6, resize: 'vertical', fontSize: 15, lineHeight: 1.4 }} />
          {seg.mensaje_alternativo && (
            <div style={{ fontSize: 13, marginBottom: 6 }}>
              <button onClick={() => setVerAlt(v => !v)} style={{ background: 'none', border: 'none', color: 'var(--teal-dark)', fontSize: 13, padding: 0 }}>
                {verAlt ? 'Ocultar alternativa' : 'Ver alternativa'}
              </button>
              {verAlt && (
                <div style={{ marginTop: 6, padding: 10, background: 'var(--bg)', borderRadius: 8, color: 'var(--text-2)' }}>
                  {seg.mensaje_alternativo}
                  <div><button onClick={() => setTexto(seg.mensaje_alternativo)} style={{ marginTop: 6, background: 'none', border: 'none', color: 'var(--teal-dark)', fontSize: 13, fontWeight: 600, padding: 0 }}>Usar esta</button></div>
                </div>
              )}
            </div>
          )}
          {!preguntar ? (
            tel ? (
              <a href={link} target="_blank" rel="noopener noreferrer" onClick={() => setTimeout(() => setPreguntar(true), 400)}
                style={{ display: 'block', background: texto.trim() ? '#25D366' : '#9FD8B4', color: '#fff', borderRadius: 10, padding: '12px', fontSize: 15, fontWeight: 600, textAlign: 'center', textDecoration: 'none' }}>
                Abrir WhatsApp
              </a>
            ) : (
              <div style={{ fontSize: 13, color: 'var(--amber-text)', background: 'var(--amber-bg)', padding: '8px 10px', borderRadius: 8 }}>
                Sin teléfono en la ficha. Agrégalo en una cita de la paciente para usar el botón.
                <button onClick={() => setPreguntar(true)} style={{ display: 'block', marginTop: 6, background: 'none', border: 'none', color: 'var(--amber-text)', fontWeight: 600, fontSize: 13, padding: 0 }}>Ya le escribí por otro medio</button>
              </div>
            )
          ) : (
            <div style={{ background: 'var(--teal-light)', borderRadius: 10, padding: 10 }}>
              <div style={{ fontSize: 14, fontWeight: 500, color: 'var(--teal-dark)', marginBottom: 8 }}>¿Lo enviaste?</div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={marcarEnviado} style={{ flex: 1, ...s.saveBtn, marginTop: 0, padding: 10, fontSize: 15 }}>Sí, enviado</button>
                <button onClick={() => setPreguntar(false)} style={{ flex: 1, ...s.possAddBtn, padding: 10 }}>Todavía no</button>
              </div>
            </div>
          )}
          <BotonesResultado seg={seg} hoy={hoy} actualizar={actualizar} />
        </div>
      );
    }

    function BotonesResultado({ seg, hoy, actualizar }) {
      const btn = { flex: '1 1 30%', padding: '8px 4px', borderRadius: 8, fontSize: 13, fontWeight: 500, border: '0.5px solid var(--border-strong)', background: 'var(--bg)', color: 'var(--text-2)' };
      function sinRespuesta() {
        if ((seg.intento || 1) >= 2) return actualizar(seg.id, { estado: 'en_pausa', resultado: 'sin respuesta tras 2 contactos', proximo_contacto: sumarMeses(hoy, 3) });
        return actualizar(seg.id, { estado: 'sin_respuesta', resultado: 'sin respuesta', intento: 2, mensaje_propuesto: null, mensaje_alternativo: null });
      }
      return (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 10 }}>
          {seg.estado !== 'enviado' && (
            <button style={btn} onClick={() => actualizar(seg.id, { estado: 'enviado', fecha_envio: hoy, intento: seg.estado === 'sin_respuesta' ? 2 : (seg.intento || 1) })}>Ya le escribí</button>
          )}
          <button style={btn} onClick={() => actualizar(seg.id, { estado: 'respondio', resultado: 'respondió', proximo_contacto: hoy })}>Respondió</button>
          <button style={{ ...btn, color: 'var(--green-text)', borderColor: 'var(--green-text)' }} onClick={() => actualizar(seg.id, { estado: 'agendo', resultado: 'agendó' })}>Agendó</button>
          <button style={btn} onClick={sinRespuesta}>Sin respuesta</button>
          <button style={btn} onClick={() => actualizar(seg.id, { estado: 'en_pausa', resultado: 'no por ahora', proximo_contacto: sumarMeses(hoy, 3) })}>En pausa</button>
          <button style={{ ...btn, color: 'var(--red-text)' }} onClick={() => { if (confirm('¿Cerrar este seguimiento? Sale de la lista.')) actualizar(seg.id, { estado: 'cerrado', resultado: 'cerrado por Ana' }); }}>Cerrar</button>
        </div>
      );
    }

    function FilaProgramado({ seg, hoy, card, actualizar }) {
      const [abierto, setAbierto] = useState(false);
      return (
        <div style={card}>
          <div style={{ display: 'flex', justifyContent: 'space-between', gap: 10 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 500 }}>{nombreCompleto(seg.pacientes)}</div>
              <div style={{ fontSize: 12, color: 'var(--text-2)' }}>
                {MOTIVO_LABEL[seg.motivo] || 'Contacto'}{seg.tratamiento ? ` · ${seg.tratamiento}` : ''}{seg.estado === 'en_pausa' ? ' · en pausa' : ''}
              </div>
            </div>
            <div style={{ textAlign: 'right', flexShrink: 0 }}>
              <div style={{ fontSize: 13, color: 'var(--text-2)' }}>{fmtCorto(seg.proximo_contacto)}</div>
              <button onClick={() => setAbierto(v => !v)} style={{ background: 'none', border: 'none', color: 'var(--teal-dark)', fontSize: 13, fontWeight: 600, padding: 0, marginTop: 2 }}>
                {abierto ? 'Ocultar' : 'Cambiar'}
              </button>
            </div>
          </div>
          {abierto && <Situacion seg={seg} hoy={hoy} actualizar={actualizar} onListo={() => setAbierto(false)} />}
        </div>
      );
    }

    function TarjetaFuga({ seg, hoy, card, actualizar }) {
      return (
        <div style={card}>
          <div style={{ fontSize: 15, fontWeight: 500 }}>{nombreCompleto(seg.pacientes)}</div>
          <div style={{ fontSize: 13, color: 'var(--text-2)', marginTop: 2 }}>{seg.tratamiento || 'Atención'} · {fmtCorto(seg.fecha_atencion)}</div>
          <Situacion seg={seg} hoy={hoy} actualizar={actualizar} />
        </div>
      );
    }

    // ¿En qué está esta paciente? Ana elige la situación real y lo que corresponde.
    const SITUACIONES = [
      ['escribir', 'Hay que escribirle'],
      ['escribi', 'Ya le escribí'],
      ['agendo', 'Ya agendó'],
      ['no_seguir', 'No seguir'],
    ];

    function Situacion({ seg, hoy, actualizar, onListo }) {
      const [sit, setSit] = useState('escribir');
      const [fecha, setFecha] = useState('');
      const [fechaEnvio, setFechaEnvio] = useState(hoy);
      const [fechaCita, setFechaCita] = useState('');
      const [motivo, setMotivo] = useState(seg.motivo || 'control');
      const [nota, setNota] = useState('');
      const [guardando, setGuardando] = useState(false);
      const atajos = [['2 sem', () => sumarDias(hoy, 14)], ['1 mes', () => sumarMeses(hoy, 1)], ['3 meses', () => sumarMeses(hoy, 3)], ['4 meses', () => sumarMeses(hoy, 4)]];
      const chip = (activo) => ({ padding: '7px 11px', borderRadius: 14, fontSize: 13, fontWeight: activo ? 600 : 400,
        border: activo ? '1px solid var(--teal-dark)' : '0.5px solid var(--border-strong)',
        background: activo ? 'var(--teal-light)' : 'var(--bg)', color: activo ? 'var(--teal-dark)' : 'var(--text-2)' });
      const campo = { ...s.input, marginBottom: 0, padding: '9px 10px' };
      const etiqueta = { fontSize: 12, color: 'var(--text-3)', margin: '10px 0 4px' };

      const listo = sit === 'escribir' ? !!fecha : sit === 'escribi' ? !!fechaEnvio : true;
      const textoBoton = {
        escribir: fecha ? `Programar para el ${fmtCorto(fecha)}` : 'Elige una fecha',
        escribi: 'Guardar: espero su respuesta',
        agendo: 'Guardar: agendó',
        no_seguir: 'Sacar de la lista',
      }[sit];

      async function guardar() {
        if (!listo || guardando) return;
        const conNota = nota.trim()
          ? { conversado: [seg.conversado, nota.trim()].filter(Boolean).join(' · ') } : {};
        let cambios;
        if (sit === 'escribir') cambios = { estado: 'programado', proximo_contacto: fecha, motivo };
        if (sit === 'escribi') cambios = { estado: 'enviado', fecha_envio: fechaEnvio, motivo, intento: seg.intento || 1, resultado: null };
        if (sit === 'agendo') cambios = { estado: 'agendo', motivo, resultado: fechaCita ? `agendó para el ${fmtCorto(fechaCita)}` : 'agendó' };
        if (sit === 'no_seguir') {
          if (!confirm('¿Sacar a esta paciente de Continuidad? No volverá a aparecer en la lista.')) return;
          cambios = { estado: 'cerrado', resultado: 'cerrado por Ana' };
        }
        setGuardando(true);
        const ok = await actualizar(seg.id, { ...cambios, ...conNota, actualizado: new Date().toISOString() });
        setGuardando(false);
        if (ok && onListo) onListo();
      }

      return (
        <div>
          <div style={etiqueta}>¿En qué está?</div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            {SITUACIONES.map(([k, l]) => <button key={k} onClick={() => setSit(k)} style={chip(sit === k)}>{l}</button>)}
          </div>

          {sit === 'escribir' && (<>
            <div style={etiqueta}>¿Cuándo le escribo?</div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {atajos.map(([l, f]) => { const v = f(); return <button key={l} onClick={() => setFecha(v)} style={chip(fecha === v)}>{l}</button>; })}
            </div>
            <input type="date" value={fecha} onChange={e => setFecha(e.target.value)} style={{ ...campo, marginTop: 8 }} />
          </>)}

          {sit === 'escribi' && (<>
            <div style={etiqueta}>¿Cuándo le escribiste?</div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 8 }}>
              <button onClick={() => setFechaEnvio(hoy)} style={chip(fechaEnvio === hoy)}>Hoy</button>
              <button onClick={() => setFechaEnvio(sumarDias(hoy, -1))} style={chip(fechaEnvio === sumarDias(hoy, -1))}>Ayer</button>
            </div>
            <input type="date" value={fechaEnvio} max={hoy} onChange={e => setFechaEnvio(e.target.value)} style={campo} />
            <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>Queda en «Esperando respuesta». Si no contesta en 4 días hábiles, te propongo un segundo mensaje.</div>
          </>)}

          {sit === 'agendo' && (<>
            <div style={etiqueta}>Fecha de la cita (opcional)</div>
            <input type="date" value={fechaCita} min={hoy} onChange={e => setFechaCita(e.target.value)} style={campo} />
            <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>Se cierra este ciclo. Después de esa atención, la paciente vuelve a aparecer para definir su próximo contacto.</div>
          </>)}

          {sit !== 'no_seguir' && (<>
            <div style={etiqueta}>Motivo</div>
            <select value={motivo} onChange={e => setMotivo(e.target.value)} style={{ ...s.select, ...campo }}>
              {MOTIVOS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
            </select>
            <div style={etiqueta}>¿Qué conversaron? (opcional, sin datos clínicos)</div>
            <textarea value={nota} onChange={e => setNota(e.target.value)} rows={2}
              placeholder="Ej: se casa en marzo; quiere ver opciones para ojeras"
              style={{ ...campo, resize: 'vertical', fontSize: 15, lineHeight: 1.4 }} />
          </>)}

          <button onClick={guardar} disabled={!listo || guardando}
            style={{ ...s.saveBtn, padding: 10, fontSize: 15, marginTop: 10, opacity: listo && !guardando ? 1 : 0.5,
              ...(sit === 'no_seguir' ? { background: 'var(--red-bg)', color: 'var(--red-text)' } : {}) }}>
            {guardando ? 'Guardando…' : textoBoton}
          </button>
        </div>
      );
    }

    // ── Acceso: solo la Dra. Gormaz ─────────────────────────────
    function Login() {
      const [email, setEmail] = useState('');
      const [pass, setPass] = useState('');
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);

      async function entrar(e) {
        e.preventDefault();
        setBusy(true); setErr('');
        const { error } = await db.auth.signInWithPassword({ email: email.trim(), password: pass });
        if (error) setErr('Correo o clave incorrectos.');
        setBusy(false);
      }

      const box = { maxWidth: 360, margin: '15vh auto 0', padding: 24, background: 'var(--surface)',
        borderRadius: 'var(--radius)', border: '1px solid var(--border)' };
      const inp = { width: '100%', padding: '12px 14px', marginTop: 12, borderRadius: 8,
        border: '1px solid var(--border-strong)', background: 'var(--bg)' };
      return (
        <form style={box} onSubmit={entrar}>
          <div style={{ fontSize: 20, fontWeight: 600, color: 'var(--teal-dark)' }}>Mi Agenda</div>
          <div style={{ fontSize: 14, color: 'var(--text-2)', marginTop: 4 }}>Ingresa con tu cuenta</div>
          <input style={inp} type="email" autoComplete="username" placeholder="Correo"
            value={email} onChange={e => setEmail(e.target.value)} required />
          <input style={inp} type="password" autoComplete="current-password" placeholder="Clave"
            value={pass} onChange={e => setPass(e.target.value)} required />
          {err && <div style={{ color: 'var(--red-text)', fontSize: 14, marginTop: 10 }}>{err}</div>}
          <button type="submit" disabled={busy} style={{ width: '100%', marginTop: 16, padding: 12,
            border: 'none', borderRadius: 8, background: 'var(--teal)', color: '#fff', fontWeight: 600 }}>
            {busy ? 'Entrando…' : 'Entrar'}
          </button>
        </form>
      );
    }

    function AuthGate() {
      const [session, setSession] = useState(undefined);
      useEffect(() => {
        db.auth.getSession().then(({ data }) => setSession(data.session));
        const { data: sub } = db.auth.onAuthStateChange((_e, s) => setSession(s));
        return () => sub.subscription.unsubscribe();
      }, []);
      if (session === undefined) return null;
      return session ? <App /> : <Login />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate />);
  </script>
</body>
</html>
